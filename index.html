<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahsan Assistant AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151c2e;
            padding: 12px 18px;
            border-radius: 15px;
            border: 1px solid #232e48;
        }

        .header h2 {
            font-size: 16px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .user-tag {
            background: #0284c7;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 15px;
            background: #111827;
            border-radius: 18px;
            border: 1px solid #1f293d;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0f172a;
            border: 1px solid #0284c7;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .ai-name {
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #151c2e;
            padding: 8px;
            border-radius: 15px;
            border: 1px solid #232e48;
        }

        .btn-mic {
            background: #6366f1;
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .input-box {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #232e48;
            padding: 12px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .btn-send {
            background: #06b6d4;
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>AHSAN ASSISTANT AI</h2>
        <div class="user-tag">Ahsan</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg ai-msg">
            <div class="ai-name">Ahsan Assistant AI</div>
            Namaste! Main Ahsan bhai ka personal AI assistant hoon. Boliye main aapki kya madad karoon?
        </div>
    </div>

    <div class="controls">
        <button class="btn-mic" onclick="startMic()">Mic</button>
        <input type="text" id="userInput" class="input-box" placeholder="Ask anything..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>

    <script>
        let synth = window.speechSynthesis;

        // Load voices for speech
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => synth.getVoices();
        }

        function speakText(text) {
            if (!synth) return;
            synth.cancel(); // Stop any ongoing speech

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN'; // Hindi voice support
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            let voices = synth.getVoices();
            let hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
            if (hindiVoice) {
                utterance.voice = hindiVoice;
            }

            synth.speak(utterance);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            let input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = '';

            // AI intelligent response simulation
            setTimeout(() => {
                let reply = getSmartReply(text);
                addMessage(reply, 'ai-msg', true);
                speakText(reply); // Yeh function ab bol kar bhi sunayega!
            }, 500);
        }

        function addMessage(text, className, isAI = false) {
            let chatBox = document.getElementById('chatBox');
            let div = document.createElement('div');
            div.className = `msg ${className}`;
            
            if (isAI) {
                div.innerHTML = `<div class="ai-name">Ahsan Assistant AI</div>${text}`;
            } else {
                div.innerText = text;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getSmartReply(query) {
            let q = query.toLowerCase();
            if (q.includes('hi') || q.includes('hello') || q.includes('salam')) {
                return "Salam Ahsan bhai! Kaise hain aap? Sab theek-thaak?";
            } else if (q.includes('kaise ho') || q.includes('kya haal')) {
                return "Main ekdum badiya hoon Ahsan bhai, aap bataiye aap kaise hain?";
            } else if (q.includes('tum kaun ho') || q.includes('who are you')) {
                return "Main Ahsan Assistant AI hoon, jise Ahsan bhai ne Telkathu me banaya hai!";
            } else if (q.includes('telkathu')) {
                return "Telkathu hamari hi jagah hai, aur Ahsan bhai yahan ke genius developer hain!";
            } else {
                return "Aapne bilkul theek kaha Ahsan bhai, main aapke har hukum par taiyar hoon!";
            }
        }

        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka device voice recognition support nahi karta.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.start();

            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                sendMessage();
            };
        }

        // Welcome speech when app opens
        window.onload = function() {
            setTimeout(() => {
                speakText("Namaste! Main Ahsan Assistant AI hoon.");
            }, 1000);
        };
    </script>
</body>
</html>
