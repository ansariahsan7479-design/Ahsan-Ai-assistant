<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahsan Assistant AI</title>
    <style>
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        input, textarea, pre, code { -webkit-user-select: text; user-select: text; }
        
        body { 
            background-color: #090d16; 
            color: #f1f5f9; 
            font-family: system-ui, sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 12px; 
            width: 100%;
            max-width: 480px; 
            margin: 0 auto; 
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 10px; }

        header {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            padding: 12px 16px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-icon {
            background-color: #1e293b;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        .user-btn {
            font-size: 11px;
            background-color: #083344;
            color: #67e8f9;
            border: 1px solid #0e7490;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin: 10px 0;
            padding: 14px;
            background-color: rgba(2, 6, 23, 0.4);
            border: 1px solid #0f172a;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

        #welcomeScreen {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 0 16px;
        }

        .gemini-card {
            width: 100%;
            max-width: 280px;
            height: 140px;
            background: radial-gradient(circle at bottom, rgba(99, 102, 241, 0.25) 0%, rgba(15, 23, 42, 0.95) 70%);
            border: 2px solid rgba(129, 140, 248, 0.4);
            border-radius: 28px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .side-box { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .center-star-box { width: 46px; height: 46px; background: #ffffff; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); margin: 0 12px; animation: geminiFloat 3s infinite ease-in-out; }
        @keyframes geminiFloat { 0% { transform: translateY(0px) scale(0.9); } 50% { transform: translateY(-8px) scale(1.1); } 100% { transform: translateY(0px) scale(0.9); } }
        
        .chamakdar { background: linear-gradient(to right, #38bdf8, #c084fc, #f472b6); -webkit-background-clip: text; color: transparent; font-weight: 800; }

        .input-bar {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            padding: 10px 12px;
            border-radius: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .input-field {
            width: 100%;
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
        }
        .input-field:focus { border-color: #06b6d4; }

        .btn-action {
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 13px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 280px;
            background-color: #0f172a;
            border-right: 1px solid #1e293b;
            z-index: 50;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
            transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }

        .overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 40;
        }

        .speak-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div id="overlay" class="overlay hidden" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="sidebar">
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
                <h2 style="font-size: 13px;" class="chamakdar">Chat History</h2>
                <button onclick="toggleSidebar()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size: 14px;">✕</button>
            </div>
            <div class="flex gap-2">
                <button onclick="newChat()" class="btn-action" style="flex:1; background-color:#0891b2; color:#020617; padding: 8px;">+ New Chat</button>
                <button onclick="clearHistory()" class="btn-action" style="background-color:#4c0519; color:#fecdd3; padding: 8px;">Clear</button>
            </div>
            <div id="historyList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 60vh;"></div>
        </div>
        <div style="border-top: 1px solid #1e293b; padding-top: 8px; text-align: center; font-size: 10px; color: #64748b;">Ahsan Assistant AI</div>
    </div>

    <header>
        <div class="flex items-center gap-2">
            <button onclick="toggleSidebar()" class="btn-icon">=</button>
            <h1 style="font-size: 13px;" class="chamakdar">AHSAN ASSISTANT AI</h1>
        </div>
        <button onclick="alert('Ahsan Bhai Logged In')" class="user-btn">Ahsan</button>
    </header>

    <div id="chatContainer" class="chat-container">
        <div id="welcomeScreen">
            <div class="gemini-card">
                <div class="side-box"></div>
                <div class="center-star-box">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#g)"/></svg>
                    <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs>
                </div>
                <div class="side-box"></div>
            </div>

            <h2 class="chamakdar" style="font-size: 16px;">Welcome to Ahsan Assistant AI</h2>
            <p style="font-size: 12px; color: #94a3b8;">Kuch bhi puchiye, HD image banwaiye ya mic se boliye!</p>
        </div>
    </div>

    <div class="input-bar">
        <button id="micBtn" onclick="toggleVoice()" class="btn-action" style="background-color: #4f46e5; color: white;">Mic</button>
        <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')sendMessage()" class="input-field">
        <button onclick="sendMessage()" class="btn-action" style="background-color: #0891b2; color: #020617;">Send</button>
    </div>

    <script>
        var recognition = null;
        var isRec = false;
        var historyList = [];
        var currentAudio = null;

        function toggleSidebar() {
            var s = document.getElementById('sidebar');
            var o = document.getElementById('overlay');
            if(s) s.classList.toggle('open');
            if(o) o.classList.toggle('hidden');
        }

        function toggleVoice() {
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) { alert('Voice not supported'); return; }
            if(!recognition) {
                recognition = new SR();
                recognition.lang = 'hi-IN';
                recognition.onresult = function(e) {
                    document.getElementById('userInput').value = e.results[0][0].transcript;
                    stopRecUI();
                    sendMessage();
                };
                recognition.onerror = stopRecUI;
                recognition.onend = stopRecUI;
            }
            if(isRec) { recognition.stop(); stopRecUI(); }
            else {
                if(currentAudio) { currentAudio.pause(); currentAudio = null; }
                try { recognition.start(); isRec = true; document.getElementById('micBtn').innerText = 'Stop'; document.getElementById('micBtn').style.background = '#dc2626'; } catch(e){}
            }
        }

        function stopRecUI() {
            isRec = false;
            var b = document.getElementById('micBtn');
            if(b) { b.innerText = 'Mic'; b.style.background = '#4f46e5'; }
        }

        function newChat() {
            if(currentAudio) { currentAudio.pause(); currentAudio = null; }
            var cc = document.getElementById('chatContainer');
            if(cc) cc.innerHTML = '<div id="welcomeScreen"><div class="gemini-card"><div class="side-box"></div><div class="center-star-box"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#g)"/></svg></div><div class="side-box"></div></div><h2 class="chamakdar" style="font-size: 16px;">Welcome to Ahsan Assistant AI</h2><p style="font-size: 12px; color: #94a3b8;">Kuch bhi puchiye, HD image banwaiye ya mic se boliye!</p></div>';
            toggleSidebar();
        }

        function clearHistory() {
            if(confirm("Saari history delete karein?")) {
                historyList = [];
                localStorage.removeItem('chat_history');
                renderHistory();
            }
        }

        function speak(text) {
            if(currentAudio) { currentAudio.pause(); currentAudio = null; }
            var clean = text.replace(/<[^>]*>?/gm, '').replace(/[*#_`~[\]()]/g, ' ').trim();
            if(!clean) return;
            var url = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(clean) + "&tl=hi&client=tw-ob";
            currentAudio = new Audio(url);
            currentAudio.play().catch(function(){});
        }

        function renderHistory() {
            var el = document.getElementById('historyList');
            if(!el) return;
            el.innerHTML = '';
            if(historyList.length === 0) {
                el.innerHTML = '<div style="font-size: 12px; color: #64748b; text-align: center; padding: 16px 0;">Koi history nahi hai</div>';
                return;
            }
            for(var i = 0; i < historyList.length; i++) {
                var d = document.createElement('div');
                d.style.cssText = 'font-size: 13px; color: #cbd5e1; background-color: #1e293b; padding: 10px; border-radius: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
                d.innerText = historyList[i];
                el.appendChild(d);
            }
        }

        function getLocalReply(text) {
            var q = text.toLowerCase();
            if(q.indexOf('kaun') !== -1 || q.indexOf('kisne') !== -1 || q.indexOf('banaya') !== -1 || q.indexOf('who made') !== -1) {
                return "Mujhe banaye hai Ahsan bhai Telkathu ke rahne wale ne, unhone hi mujhe 16 October 2026 me banaye the.";
            } else if(q.indexOf('hi') !== -1 || q.indexOf('hello') !== -1 || q.indexOf('salam') !== -1) {
                return "Salam Ahsan bhai! Kaise hain aap?";
            } else if(q.indexOf('kaise ho') !== -1) {
                return "Main bilkul mast hoon Ahsan bhai, aap bataiye!";
            } else {
                return "Main aapki har baat samajh raha hoon Ahsan bhai, bataiye kya karna hai!";
            }
        }

        function sendMessage() {
            var input = document.getElementById('userInput');
            var text = input.value.trim();
            if(!text) return;
            var wel = document.getElementById('welcomeScreen');
            if(wel) wel.remove();
            historyList.unshift(text);
            if(historyList.length > 10) historyList.pop();
            localStorage.setItem('chat_history', JSON.stringify(historyList));
            renderHistory();
            appendMsg(text, 'user');
            input.value = '';

            var lower = text.toLowerCase();
            if(lower.indexOf('image') !== -1 || lower.indexOf('photo') !== -1 || lower.indexOf('bana do') !== -1) {
                var loadId = appendMsg('Generating HD Image...', 'ai');
                setTimeout(function() {
                    var lEl = document.getElementById(loadId);
                    if(lEl) lEl.remove();
                    var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(text) + "?width=1024&height=1024&nologo=true&enhance=true";
                    var imgHtml = 'Yeh lijiye aapki HD image:<br><br><img src="' + url + '" style="border-radius: 12px; width: 100%; border: 1px solid #334155;">';
                    appendMsg(imgHtml, 'ai', true, "Yeh lijiye aapki HD image taiyar hai!");
                }, 1500);
                return;
            }

            var loadId = appendMsg('Thinking...', 'ai');
            
            if(lower.indexOf('kaun') !== -1 || lower.indexOf('kisne') !== -1 || lower.indexOf('banaya') !== -1) {
                setTimeout(function() {
                    var lEl = document.getElementById(loadId);
                    if(lEl) lEl.remove();
                    var reply = getLocalReply(text);
                    var formattedText = reply.replace(/(Ahsan)/gi, '<span class="chamakdar">$1</span>');
                    appendMsg(formattedText, 'ai', true, reply);
                }, 400);
                return;
            }

            fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer 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",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "openrouter/auto",
                    "messages": [
                        { 
                            "role": "system", 
                            "content": "You are Ahsan Assistant AI. Whenever anyone asks who created you or who made you, you must reply precisely without any emojis: 'Mujhe banaye hai Ahsan bhai Telkathu ke rahne wale ne, unhone hi mujhe 16 October 2026 me banaye the.' Reply warmly in clear Hindi or Hinglish." 
                        },
                        { "role": "user", "content": text }
                    ]
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var lEl = document.getElementById(loadId);
                if(lEl) lEl.remove();
                if(data.choices && data.choices[0]) {
                    var reply = data.choices[0].message.content;
                    var formattedText = reply.replace(/\n/g, '<br>').replace(/(Ahsan)/gi, '<span class="chamakdar">$1</span>');
                    appendMsg(formattedText, 'ai', true, reply);
                } else {
                    var fallback = getLocalReply(text);
                    appendMsg(fallback, 'ai', false, fallback);
                }
            }).catch(function() {
                var lEl = document.getElementById(loadId);
                if(lEl) lEl.remove();
                var fallback = getLocalReply(text);
                appendMsg(fallback, 'ai', false, fallback);
            });
        }

        function appendMsg(text, sender, isHtml, speechText) {
            var cc = document.getElementById('chatContainer');
            var id = 'msg-' + Date.now();
            var div = document.createElement('div');
            div.id = id;
            if(sender === 'user') {
                div.style.cssText = 'display: flex; justify-content: flex-end; margin-bottom: 12px;';
                div.innerHTML = '<div style="background-color: #1e293b; color: #f1f5f9; padding: 10px 14px; border-radius: 16px; max-width: 85%; font-size: 13px; border: 1px solid #334155;">' + text + '</div>';
            } else {
                var rawText = speechText || text.replace(/<[^>]*>?/gm, '');
                div.style.cssText = 'display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 12px; width: 100%; gap: 6px;';
                
                var contentHtml = '<div style="font-size: 11px; color: #22d3ee; font-weight: bold;">Ahsan Assistant AI</div>' +
                                  '<div style="color: #e2e8f0; font-size: 13px; padding-left: 4px; width: 100%; line-height: 1.4;">' + (isHtml ? text : text.replace(/\n/g, '<br>')) + '</div>';
                
                contentHtml += '<button class="speak-btn" onclick="speak(\`' + rawText.replace(/'/g, "\\'") + '\`)">🔊 Suniye</button>';
                
                div.innerHTML = contentHtml;
            }
            cc.appendChild(div);
            cc.scrollTop = cc.scrollHeight;
            return id;
        }

        window.onload = function() {
            var saved = localStorage.getItem('chat_history');
            if(saved) { try { historyList = JSON.parse(saved); renderHistory(); } catch(e){} }
        };
    </script>
</body>
    </html>
